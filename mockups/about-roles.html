<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>About role tags</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" />
<link rel="stylesheet" href="../assets/css/site.css?v=20261015g" />
<link rel="stylesheet" href="../assets/css/theme.css?v=20261015g" />
<style>
  body { background: #fff; }
  .ab { --ink:#111827; --muted:#4f5967; --hair:#e3e7ec; --soft:#f6f7f9;
    --g-prog:#0369a1; --g-prog-l:#e0f0f9; --g-liai:#a8492c; --g-liai-l:#f6e6df; --g-sen:#17324d; --g-sen-l:#e6ebf1; padding-bottom: 96px; }
  .ab .shell { width: min(calc(100% - 32px), 1080px); }

  /* version switcher */
  .vbar { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--hair); }
  .vbar .shell { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 0; align-items: center; }
  .vbar strong { margin-right: 8px; color: var(--ink); font-size: .9rem; }
  .vbar a { padding: 6px 12px; border: 1px solid var(--hair); border-radius: 999px; color: var(--ink); font-size: .85rem; text-decoration: none; }
  .vbar a:hover { border-color: var(--g-prog); color: var(--g-prog); }

  .ver { padding: 64px 0 0; }
  .ver-label { display: flex; gap: 12px; align-items: baseline; margin-bottom: 6px; }
  .ver-label b { font-family: "IBM Plex Mono", monospace; font-size: .8rem; color: var(--g-prog); }
  .ver-label h2 { margin: 0; font-size: 1.6rem; font-weight: 500; letter-spacing: -.02em; color: var(--ink); }
  .ver-note { margin: 0 0 26px; max-width: 74ch; color: var(--muted); font-size: .95rem; line-height: 1.55; }
  .sub { margin: 34px 0 12px; font-size: 1.05rem; font-weight: 600; color: var(--ink); }
  .sub small { margin-left: 8px; font-weight: 400; color: var(--muted); font-size: .88rem; }

  .p-title { display: block; color: var(--g-prog); font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; line-height: 1.35; }
  .p-name { margin: 0; color: var(--ink); font-weight: 600; line-height: 1.25; letter-spacing: -.01em; }
  .p-aff { margin: 0; color: var(--muted); font-size: .88rem; line-height: 1.4; }
  .p-photo { display: block; object-fit: cover; object-position: center top; background: var(--soft); }

  /* leads panel (same as about.html) */
  .leads { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--hair); border-radius: 12px; overflow: hidden; background: linear-gradient(135deg, #fff 55%, #f1f7fb 100%); box-shadow: 0 1px 2px rgba(23,50,77,.04), 0 12px 32px -18px rgba(23,50,77,.22); }
  .leads article { display: grid; grid-template-columns: 168px 1fr; min-height: 210px; }
  .leads article + article { border-left: 1px solid var(--hair); }
  .leads .p-photo { width: 100%; height: 100%; }
  .leads .lc { padding: 26px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  .leads .p-name { font-size: 1.4rem; font-weight: 500; letter-spacing: -.02em; margin-top: 6px; }
  .colead { width: fit-content; padding: 4px 10px; border-radius: 999px; background: var(--route-core); color: #fff; }

  /* contributors (same as about.html) */
  .groups { display: grid; grid-template-columns: repeat(3, 1fr); }
  .grp { --g: var(--g-prog); --gl: var(--g-prog-l); padding: 0 26px 4px 0; border-top: 3px solid var(--g); }
  .grp + .grp { padding-left: 26px; }
  .grp.liai { --g: var(--g-liai); --gl: var(--g-liai-l); }
  .grp.sen { --g: var(--g-sen); --gl: var(--g-sen-l); }
  .grp h3 { margin: 0; padding: 18px 0 6px; color: var(--g); font-size: .98rem; font-weight: 600; }
  .grp h3 small { display: block; margin-top: 2px; color: var(--muted); font-size: .82rem; font-weight: 400; }
  .person { display: grid; grid-template-columns: 88px 1fr; gap: 16px; align-items: center; padding: 14px 0; }
  .person + .person { border-top: 1px solid var(--hair); }
  .person .p-photo { width: 88px; height: 88px; border-radius: 10px; background: var(--gl); box-shadow: 0 0 0 1px color-mix(in srgb, var(--g) 18%, transparent); }
  .person > div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .person .p-title { color: var(--g); }

  .foot { margin: 18px 0 0; color: var(--muted); font-size: .85rem; line-height: 1.5; }
  .foot sup, .star { color: var(--g-prog); font-weight: 700; }

  /* A: two pills */
  .vA .cmte { width: fit-content; padding: 3px 9px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--g, var(--g-prog)) 40%, transparent); color: var(--g, var(--g-prog)); background: #fff; font-size: .66rem; }
  .vA .cmte i { font-style: normal; opacity: .7; margin-right: 4px; }
  .vA .person .cmte { margin-bottom: 2px; }

  /* B: labeled committee row with asterisk */
  .vB .crole { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--hair); }
  .vB .crole-k { display: block; color: var(--muted); font-size: .64rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .vB .crole-v { display: block; margin-top: 2px; color: var(--ink); font-size: .9rem; font-weight: 500; }
  .vB .person .crole { margin-top: 6px; padding-top: 6px; }
  .vB .person .crole-v { color: var(--g); font-size: .84rem; }

  /* C: asterisk on the existing title */
  .vC .person .p-title, .vC .lc .ctitle { color: var(--g, var(--g-prog)); }

  /* D: key/value rows */
  .vD dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 8px 0 0; font-size: .8rem; }
  .vD dt { color: var(--muted); font-size: .64rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; align-self: center; }
  .vD dd { margin: 0; color: var(--ink); font-weight: 500; }
  .vD .person dl { margin-top: 2px; }
  .vD .person dd.c { color: var(--g); }

  /* E: committee as corner badge on the photo */
  .vE .ph { position: relative; }
  .vE .badge { position: absolute; left: 8px; right: 8px; bottom: 8px; padding: 4px 6px; border-radius: 6px; background: rgba(23,50,77,.88); color: #fff; font-size: .62rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; text-align: center; line-height: 1.25; }
  .vE .leads .ph { height: 100%; }
  .vE .person .ph .badge { left: 4px; right: 4px; bottom: 4px; font-size: .52rem; padding: 3px 4px; }

  @media (max-width: 960px) { .groups { grid-template-columns: 1fr; gap: 28px; } .grp, .grp + .grp { padding: 0 0 4px; } }
  @media (max-width: 820px) { .leads { grid-template-columns: 1fr; } .leads article + article { border-left: 0; border-top: 1px solid var(--hair); } }
  @media (max-width: 560px) { .leads article { grid-template-columns: 116px 1fr; min-height: 170px; } .leads .lc { padding: 18px; } .leads .p-name { font-size: 1.22rem; } }
</style>
</head>
<body>
<main class="ab">
  <nav class="vbar"><div class="shell"><strong>Role tag versions</strong><a href="#A">A. Two pills</a><a href="#B">B. Labeled row*</a><a href="#C">C. Asterisk only</a><a href="#D">D. Two-line key</a><a href="#E">E. Photo badge</a></div></nav>
  <div id="out"></div>
</main>

<script>
const LEADS = [
  { name: 'Shinjer Li', img: '../images/shinjer-li.png', aff: 'Eastern Virginia Medical School at Old Dominion University', cmte: 'Medical Student Lead' },
  { name: 'Florence Doo, MD, MA, CIIP', img: '../images/florence-doo.jpg', aff: 'University of Maryland Institute for Health Computing', cmte: 'Chair' },
];
const GROUPS = [
  { cls: 'prog', h: 'Program leads', s: 'Trainee, AI and international leads', people: [
    ['Raisa Amiruddin, MBBS', 'https://static.wixstatic.com/media/e6e8bc_711a5e0db52a4ea68717f796fad76a89~mv2.jpg/v1/crop/x_73%2Cy_0%2Cw_413%2Ch_518/fill/w_306%2Ch_384%2Cal_c%2Cq_80%2Cusm_0.66_1.00_0.01%2Cenc_avif%2Cquality_auto/Raisa%20Amiruddin.jpg', 'Resident Lead', 'MetroWest Medical Center, Massachusetts'],
    ['Peter Chang, MD', 'https://cdn-images.kyruus.com/providermatch/ucihealth/photos/orig/chang-peter-1841530458.png', 'AI Innovation Lead', 'University of California, Irvine'],
    ['Michail Klontzas, MD, PhD', 'https://med.uoc.gr/wp-content/uploads/2025/01/klontzas-1-280x280.jpg', 'International Lead', 'University of Crete School of Medicine'] ] },
  { cls: 'liai', h: 'Liaisons', s: 'Links to partner societies and funders', people: [
    ['Lars Grimm, MD, MHS', 'https://scholars.duke.edu/profile-images/full/0256542.jpg', 'RAHSR Liaison', 'Duke University'],
    ['Marta Heilbrun, MD', 'https://aarad.memberclicks.net/assets/About/Executive-Committee/M_Heilbrun_12_22.jpg', 'Inter-Society Liaison (RSNA)', 'Intermountain Health'],
    ['Elizabeth Krupinski, PhD', 'https://winshipcancer.emory.edu/profiles/_images/krupinski-e-headshot.jpg', 'Inter-Society Liaison (SIIM)', 'Emory University'] ] },
  { cls: 'sen', h: 'Senior advisors', s: 'Guidance and review', people: [
    ['Katherine Andriole, PhD', 'https://medschool.ucla.edu/sites/default/files/styles/box_1_1_500/public/media/images/katherine_andriole.jpg.webp?h=e9e0f3db&itok=VvcAJnUK', 'Senior AI Academic Leader', 'UCLA David Geffen School of Medicine'],
    ['Nadja Kadom, MD', 'https://med.emory.edu/departments/radiology/about-us/images/faculty-staff-awards/2025/kadom-nadja-2025-square.png', 'RRA Leadership (Guest)', "Emory University / Children's Healthcare of Atlanta"] ] },
];
const short = n => n.split(',')[0];
const img = (src, n, cls = 'p-photo') => `<img class="${cls}" src="${src}" alt="${short(n)}" loading="lazy" />`;

// Each version supplies: lead card inner (after photo), person inner, optional photo wrapper, headings and footnote.
const V = {
  A: {
    title: 'Two pills', note: 'Solid navy pill = AI2Practice role. Thin outlined pill = committee role, prefixed "Committee". Contributors carry no "Contributor" tag; the section heading "AI2Practice Contributors" says it once for everyone.',
    lead: p => `<span class="p-title colead">AI2Practice Co-Lead</span><span class="p-title cmte"><i>Committee</i>${p.cmte === 'Chair' ? 'Chair' : p.cmte}</span><p class="p-name">${p.name}</p><p class="p-aff">${p.aff}</p>`,
    person: ([n, , t, a]) => `<span class="p-title cmte"><i>Committee</i>${t}</span><p class="p-name">${n}</p><p class="p-aff">${a}</p>`,
    cHead: 'AI2Practice Contributors', cSub: 'Everyone below contributes to the site; outlined tags show their committee role.',
  },
  B: {
    title: 'Labeled committee row with asterisk', note: 'Your suggestion. The co-lead pill sits on top; a quiet labeled row below the affiliation reads "Data Science &amp; AI Committee Role*". Contributor cards repeat the same row, and one footnote explains the asterisk.',
    lead: p => `<span class="p-title colead">AI2Practice Co-Lead</span><p class="p-name">${p.name}</p><p class="p-aff">${p.aff}</p><div class="crole"><span class="crole-k">Data Science &amp; AI Committee Role<span class="star">*</span></span><span class="crole-v">${p.cmte === 'Chair' ? 'Committee Chair' : p.cmte}</span></div>`,
    person: ([n, , t, a]) => `<p class="p-name">${n}</p><p class="p-aff">${a}</p><div class="crole"><span class="crole-k">Committee Role<span class="star">*</span></span><span class="crole-v">${t}</span></div>`,
    cHead: 'Contributors', cSub: 'All AI2Practice contributors.',
    foot: '<sup>*</sup>Role on the AAR / RRA Committee on Data Science &amp; AI. Everyone listed contributes to AI2Practice.',
  },
  C: {
    title: 'Asterisk only (smallest change)', note: 'Keeps today\'s layout. Co-lead pill is new; every existing title just gains an asterisk, and one footnote under Contributors says what it means.',
    lead: p => `<span class="p-title colead">AI2Practice Co-Lead</span><p class="p-name">${p.name}</p><p class="p-aff">${p.aff}</p><span class="p-title ctitle" style="margin-top:8px">${p.cmte === 'Chair' ? 'Committee Chair' : p.cmte}<span class="star">*</span></span>`,
    person: ([n, , t, a]) => `<span class="p-title">${t}<span class="star">*</span></span><p class="p-name">${n}</p><p class="p-aff">${a}</p>`,
    cHead: 'Contributors', cSub: '',
    foot: '<sup>*</sup>Data Science &amp; AI Committee role. All people on this page are AI2Practice contributors.',
  },
  D: {
    title: 'Two-line key', note: 'Each card spells out both hats as label/value pairs: "AI2Practice" and "Committee". Most explicit; slightly busier. Contributors read "AI2Practice: Contributor".',
    lead: p => `<p class="p-name">${p.name}</p><p class="p-aff">${p.aff}</p><dl><dt>AI2Practice</dt><dd>Co-Lead</dd><dt>Committee</dt><dd>${p.cmte}</dd></dl>`,
    person: ([n, , t, a]) => `<p class="p-name">${n}</p><p class="p-aff">${a}</p><dl><dt>AI2Practice</dt><dd>Contributor</dd><dt>Committee</dt><dd class="c">${t}</dd></dl>`,
    cHead: 'Contributors', cSub: '',
  },
  E: {
    title: 'Photo badge', note: 'Committee role moves onto a small navy strip across the bottom of the photo, so the text side only carries the AI2Practice role. Clean, but long titles ("Inter-Society Liaison (RSNA)") get tight on small photos.',
    photo: (src, n, t) => `<div class="ph">${img(src, n)}<span class="badge">${t}</span></div>`,
    lead: p => `<span class="p-title colead">AI2Practice Co-Lead</span><p class="p-name">${p.name}</p><p class="p-aff">${p.aff}</p>`,
    person: ([n, , , a]) => `<span class="p-title">AI2Practice Contributor</span><p class="p-name">${n}</p><p class="p-aff">${a}</p>`,
    cHead: 'Contributors', cSub: 'Navy strip on each photo = Data Science &amp; AI Committee role.',
  },
};

document.getElementById('out').innerHTML = Object.entries(V).map(([k, v]) => {
  const ph = (src, n, t) => v.photo ? v.photo(src, n, t) : img(src, n);
  const leads = LEADS.map(p => `<article>${ph(p.img, p.name, p.cmte === 'Chair' ? 'Committee Chair' : p.cmte)}<div class="lc">${v.lead(p)}</div></article>`).join('');
  const groups = GROUPS.map(g => `<div class="grp ${g.cls}"><h3>${g.h}<small>${g.s}</small></h3>${g.people.map(p => `<div class="person">${ph(p[1], p[0], p[2])}<div>${v.person(p)}</div></div>`).join('')}</div>`).join('');
  return `<section class="ver v${k}" id="${k}"><div class="shell">
    <div class="ver-label"><b>${k}</b><h2>${v.title}</h2></div>
    <p class="ver-note">${v.note}</p>
    <p class="sub">Co-Leads</p>
    <div class="leads">${leads}</div>
    <p class="sub">${v.cHead}${v.cSub ? `<small>${v.cSub}</small>` : ''}</p>
    <div class="groups">${groups}</div>
    ${v.foot ? `<p class="foot">${v.foot}</p>` : ''}
  </div></section>`;
}).join('');
</script>
</body>
</html>
