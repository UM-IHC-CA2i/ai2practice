<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placement quiz mockup &mdash; AI2Practice</title>
<!-- MOCKUP ONLY. Not linked from the site. Remove the mockups/ folder (or pick a version) before deploying. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" />
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<style>
:root {
  --navy: #17324d; --teal: #4b9b8f; --teal-l: #e6f3f1; --blue: #0369a1; --blue-l: #e0f0f9;
  --amber: #b7791f; --amber-l: #fbf1df; --ink: #111827; --muted: #6b7280; --soft: #f5f6f8; --line: #e5e7eb;
  --sans: 'IBM Plex Sans', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--sans); color: var(--ink); background: var(--soft); line-height: 1.55; }
button { font: inherit; cursor: pointer; }

/* Mockup chrome */
.mk-bar { background: var(--navy); color: #fff; padding: 18px 16px 0; }
.mk-bar-in { max-width: 1040px; margin: 0 auto; }
.mk-bar h1 { font-size: 1.15rem; margin: 0 0 4px; font-weight: 600; }
.mk-bar p { margin: 0 0 14px; color: #c9d6e3; font-size: .9rem; max-width: 760px; }
.mk-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.mk-tab { background: transparent; color: #c9d6e3; border: 0; border-radius: 8px 8px 0 0; padding: 10px 14px; text-align: left; }
.mk-tab b { display: block; font-size: .92rem; color: #fff; }
.mk-tab small { font-size: .78rem; }
.mk-tab[aria-selected="true"] { background: var(--soft); color: var(--muted); }
.mk-tab[aria-selected="true"] b { color: var(--navy); }
.mk-note { max-width: 1040px; margin: 16px auto 0; padding: 0 16px; font-size: .86rem; color: var(--muted); }
.mk-note strong { color: var(--ink); }

/* Stage */
.stage { max-width: 1040px; margin: 16px auto 60px; padding: 0 16px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 28px; }
.narrow { max-width: 680px; margin: 0 auto; }
.eyebrow { font-family: var(--mono); font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--teal); margin: 0 0 6px; }
h2 { font-size: 1.45rem; margin: 0 0 8px; color: var(--navy); line-height: 1.25; }
h3 { font-size: 1.05rem; margin: 0 0 6px; color: var(--navy); }
.lede { color: var(--muted); margin: 0 0 20px; }
.progress { height: 4px; background: var(--line); border-radius: 4px; margin: 0 0 22px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--teal); transition: width .25s; }

/* Choices */
.opts { display: grid; gap: 8px; margin: 0 0 20px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; color: var(--ink); }
.opt:hover { border-color: #b8c4d0; }
.opt[aria-pressed="true"] { border-color: var(--teal); background: var(--teal-l); }
.opt .dot { flex: 0 0 16px; height: 16px; border-radius: 50%; border: 2px solid #b8c4d0; margin-top: 3px; }
.opt[aria-pressed="true"] .dot { border-color: var(--teal); background: radial-gradient(var(--teal) 45%, transparent 50%); }
.opt.multi .dot { border-radius: 4px; }
.opt.multi[aria-pressed="true"] .dot { background: var(--teal); box-shadow: inset 0 0 0 2px #fff; }
.opt b { display: block; font-weight: 600; }
.opt small { color: var(--muted); font-size: .85rem; }
.opt.correct { border-color: var(--teal); background: var(--teal-l); }
.opt.wrong { border-color: #c98a76; background: #f8ece7; }
.explain { background: var(--soft); border-left: 3px solid var(--teal); border-radius: 0 8px 8px 0; padding: 10px 14px; font-size: .92rem; margin: -6px 0 18px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; }
.chip { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 13px; font-size: .9rem; color: var(--ink); }
.chip[aria-pressed="true"] { border-color: var(--teal); background: var(--teal-l); color: var(--navy); font-weight: 500; }
.q-label { font-weight: 600; margin: 0 0 8px; }

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.btn { border: 1.5px solid var(--navy); background: var(--navy); color: #fff; border-radius: 8px; padding: 10px 18px; font-weight: 500; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn.ghost { background: #fff; color: var(--navy); }
.btn.link { border: 0; background: none; color: var(--muted); padding: 10px 4px; text-decoration: underline; }

/* Recommendation tags and lists */
.tag { font-family: var(--mono); font-size: .68rem; letter-spacing: .04em; text-transform: uppercase; border-radius: 4px; padding: 2px 6px; white-space: nowrap; }
.tag.rec { background: var(--teal-l); color: #2f6f66; }
.tag.opt { background: var(--amber-l); color: #8a5a12; }
.tag.skip { background: var(--soft); color: var(--muted); }
.mod { margin: 0 0 18px; }
.mod-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); padding: 0 0 6px; margin: 0 0 4px; }
.mod-head b { color: var(--navy); }
.mod-head small { color: var(--muted); }
.les { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.les input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--teal); }
.les .t { font-weight: 500; }
.les .why { display: block; font-size: .84rem; color: var(--muted); }
.les.off .t { color: var(--muted); }
.summary { display: flex; gap: 22px; flex-wrap: wrap; background: var(--soft); border-radius: 10px; padding: 12px 16px; margin: 0 0 18px; }
.summary div b { display: block; font-size: 1.3rem; color: var(--navy); }
.summary div small { color: var(--muted); font-size: .8rem; }
.fine { font-size: .84rem; color: var(--muted); margin: 14px 0 0; }

/* A2 split */
.split { display: grid; grid-template-columns: 1.1fr .9fr; gap: 18px; align-items: start; }
.sticky { position: sticky; top: 16px; }
.mini .les { grid-template-columns: 1fr auto; padding: 5px 0; }
.mini .les .why { display: none; }

/* C1 three cards */
.paths { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 0 0 18px; }
.path { border: 1.5px solid var(--line); border-radius: 12px; padding: 16px; background: #fff; text-align: left; color: var(--ink); display: flex; flex-direction: column; gap: 6px; }
.path.main { border-color: var(--teal); background: var(--teal-l); }
.path b { font-size: 1.02rem; color: var(--navy); }
.path .big { font-size: 1.6rem; font-weight: 600; color: var(--navy); line-height: 1.1; }
.path small { color: var(--muted); }
.path .go { margin-top: auto; padding-top: 8px; font-weight: 500; color: var(--blue); }

/* C2 route rows */
.route { margin: 0 0 18px; }
.rrow { display: grid; grid-template-columns: 170px 1fr; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.rrow-name b { display: block; color: var(--navy); }
.rrow-name small { color: var(--muted); }
.stops { position: relative; display: flex; justify-content: space-between; gap: 6px; padding: 0 6px; }
.stops::before { content: ""; position: absolute; left: 20px; right: 20px; top: 15px; height: 3px; background: var(--line); }
.stop { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 0; width: 88px; color: var(--ink); }
.stop i { width: 32px; height: 32px; border-radius: 50%; background: var(--teal); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--teal); display: grid; place-items: center; color: #fff; font-style: normal; font-size: .75rem; font-weight: 600; }
.stop.off i { background: #fff; color: var(--muted); box-shadow: 0 0 0 2px #b8c4d0; border-style: dashed; }
.stop.opt i { background: var(--amber-l); color: #8a5a12; box-shadow: 0 0 0 2px var(--amber); }
.stop span { font-size: .76rem; text-align: center; line-height: 1.25; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); margin: 0 0 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin-right: 5px; }
.gate { border: 1.5px solid var(--line); border-radius: 12px; padding: 18px; }

pre { background: #0f2236; color: #d5e3f0; font-family: var(--mono); font-size: .78rem; border-radius: 10px; padding: 14px; overflow-x: auto; }

@media (max-width: 760px) {
  .card { padding: 20px 16px; }
  .opts.two, .split, .paths { grid-template-columns: 1fr; }
  .sticky { position: static; }
  .rrow { grid-template-columns: 1fr; }
  .stop { width: 56px; }
  .stop span { font-size: .68rem; }
}
</style>
</head>
<body>

<header class="mk-bar">
  <div class="mk-bar-in">
    <h1>Placement quiz: four versions to compare</h1>
    <p>This screen shows right after sign-in. Each version recommends lessons; on every result screen the learner can take the suggestion, take the full course, or change the list. Click through each tab, then tell me which one to build.</p>
    <div class="mk-tabs" role="tablist">
      <button class="mk-tab" role="tab" data-v="A1"><b>A1 &middot; Step by step</b><small>Profile, one question per screen</small></button>
      <button class="mk-tab" role="tab" data-v="A2"><b>A2 &middot; One page</b><small>Profile with live preview</small></button>
      <button class="mk-tab" role="tab" data-v="C1"><b>C1 &middot; Profile + check</b><small>2 profile, 6&ndash;8 questions</small></button>
      <button class="mk-tab" role="tab" data-v="C2"><b>C2 &middot; Test out by module</b><small>Opt in to each module&rsquo;s check</small></button>
    </div>
  </div>
</header>
<p class="mk-note" id="mkNote"></p>
<main class="stage" id="stage"></main>

<script>
(function(){
  'use strict';

  /* ---------- Course data ---------- */
  var MODULES = [
    { id:'m1', n:1, name:'AI Fundamentals' },
    { id:'m2', n:2, name:'Radiology Basics' },
    { id:'m3', n:3, name:'AI in Clinical Practice' }
  ];
  var LESSONS = [
    { key:'m1-1', m:'m1', t:'AI Around You' },
    { key:'m1-2', m:'m1', t:'How Models Learn' },
    { key:'m1-3', m:'m1', t:'Data & Labels' },
    { key:'m1-4', m:'m1', t:'Measuring Performance' },
    { key:'m1-5', m:'m1', t:'Limits & Failures' },
    { key:'m2-1', m:'m2', t:'What Radiology Is' },
    { key:'m2-2', m:'m2', t:'Images as Data' },
    { key:'m2-3', m:'m2', t:'The Journey of a Scan' },
    { key:'m2-4', m:'m2', t:'Reading a Radiology Report' },
    { key:'m3-1', m:'m3', t:'AI in Radiology & Medicine' },
    { key:'m3-2', m:'m3', t:'Does It Work, and Is It Worth It?' },
    { key:'m3-3', m:'m3', t:'Thinking With AI' },
    { key:'m3-4', m:'m3', t:'Responsibility & Patients' },
    { key:'m3-5', m:'m3', t:'The Future of AI in Radiology' }
  ];
  var MIN_PER_LESSON = 17;

  var GROUPS = [
    { id:'student',  label:'Medical student' },
    { id:'radtrainee', label:'Radiology resident or fellow' },
    { id:'radiologist', label:'Radiologist' },
    { id:'physician', label:'Physician or trainee in another specialty', note:'Including residents, fellows, APPs and nurses' },
    { id:'other', label:'Something else', note:'Technologist, researcher, administrator, educator, industry' }
  ];
  var RAD = { radtrainee:1, radiologist:1 };

  var PROFILE_Q = {
    group: { q:'Which best describes you?', opts:GROUPS.map(function(g){ return { v:g.id, label:g.label, note:g.note }; }) },
    aiUse: { q:'How often do you use AI tools for school or work?', opts:[
      { v:'never', label:'Rarely or never' }, { v:'some', label:'Now and then' }, { v:'daily', label:'Most days' } ] },
    terms: { q:'How familiar are terms like training data, sensitivity and false positive?', opts:[
      { v:'new', label:'Mostly new to me' }, { v:'some', label:'I know some of them' }, { v:'solid', label:'I use them comfortably' } ] },
    reads: { q:'How comfortable are you reading a CT or X-ray report?', skipFor:RAD, opts:[
      { v:'no', label:'Not yet' }, { v:'some', label:'I get the gist' }, { v:'yes', label:'Comfortable' } ] },
    goals: { q:'What do you most want from this course?', multi:true, hint:'Pick any that apply.', opts:[
      { v:'basics', label:'Understand how AI works' },
      { v:'judge', label:'Tell whether an AI tool is any good' },
      { v:'skills', label:'Use AI without losing my own skills' },
      { v:'lead', label:'Teach, lead or set policy on AI' } ] }
  };

  /* Knowledge questions. Each one stands in for the lessons listed. */
  var KQ = {
    m1learn: { lessons:['m1-2','m1-3'], topic:'how models learn',
      q:'A model is trained on 20,000 chest X-rays, each labeled by a radiologist as pneumothorax or no pneumothorax. What does it learn?',
      opts:['Rules a programmer wrote about how pneumothorax looks','Patterns in the images that go along with each label','The radiologists’ reasoning behind each label','Anatomy, the same way a student learns it'], a:1,
      why:'The model only sees images and labels. It finds whatever patterns predict the label, which may or may not be the ones a radiologist would use.' },
    m1metric: { lessons:['m1-4'], topic:'sensitivity',
      q:'A pneumothorax tool is 94% sensitive. What does that mean?',
      opts:['When it flags a pneumothorax, it is right 94% of the time','Of patients who have a pneumothorax, it flags 94%','It gets 94% of all studies right','6% of its flags are false alarms'], a:1,
      why:'Sensitivity counts how many true cases the tool catches. How often a flag is right is a different number (positive predictive value) and depends on how common the disease is.' },
    m1short: { lessons:['m1-5'], topic:'shortcut learning',
      q:'A pneumothorax detector tests well, but most of the positive training images showed a chest tube. What is the most likely problem?',
      opts:['It needs more training images','It may have learned to spot chest tubes instead of pneumothorax','Chest tubes make pneumothorax harder to see','Nothing; chest tubes are a valid clue'], a:1,
      why:'This is shortcut learning. Patients already treated have tubes, so the tool can score well and still miss the untreated pneumothorax that matters.' },
    m2mod: { lessons:['m2-1'], topic:'imaging types',
      q:'Which of these imaging tests uses no ionizing radiation?',
      opts:['CT','Mammography','MRI','Fluoroscopy'], a:2,
      why:'MRI uses a strong magnetic field and radio waves. CT, mammography and fluoroscopy all use X-rays.' },
    m2data: { lessons:['m2-2','m2-3'], topic:'images and imaging systems',
      q:'The same CT slice looks very different in a lung window and a soft-tissue window. Why?',
      opts:['The scanner took two separate images','The display settings change which range of densities is shown','The lung window uses contrast','One of the windows has been processed by AI'], a:1,
      why:'The stored numbers stay the same. The window decides which range of densities is spread across black to white.' },
    m2report: { lessons:['m2-4'], topic:'reading reports',
      q:'A chest X-ray report says “findings may represent pneumonia in the appropriate clinical setting.” What is the radiologist saying?',
      opts:['Pneumonia is confirmed','Pneumonia is ruled out','Pneumonia is possible; it depends on the patient’s symptoms and exam','The study needs to be repeated'], a:2,
      why:'Hedged wording signals how sure the radiologist is. Here the image fits pneumonia, but the diagnosis depends on the clinical picture.' },
    m3evid: { lessons:['m3-1','m3-2'], topic:'judging evidence',
      q:'A vendor reports an AUC of 0.97 from a study at their own partner hospital. What is the best next question?',
      opts:['Is 0.97 above the FDA cutoff?','How does it do on patients and scanners like ours?','Can the AUC be raised to 0.99?','How many hospitals already bought it?'], a:1,
      why:'Performance often drops at a new site. Local or external validation tells you more than a headline number.' },
    m3skill: { lessons:['m3-3'], topic:'never-skilling',
      q:'A resident has read chest X-rays with an AI helper since day one. On a rotation without it, they miss findings they never learned to look for. What is this?',
      opts:['Deskilling','Never-skilling','Mis-skilling','Automation bias'], a:1,
      why:'The skill never formed in the first place. Deskilling is losing a skill you once had; mis-skilling is learning the AI’s mistakes.' },
    m3resp: { lessons:['m3-4','m3-5'], topic:'responsibility',
      q:'An AI drafts a report with a wrong measurement, and the radiologist signs it without noticing. Who is responsible?',
      opts:['The AI vendor','The hospital that bought the tool','The radiologist who signed','No one, since it was an AI error'], a:2,
      why:'Whoever signs owns the report. The tool can be part of the story, but it does not take on the clinical responsibility.' }
  };
  var KQ_BY_MODULE = { m1:['m1learn','m1metric','m1short'], m2:['m2mod','m2data','m2report'], m3:['m3evid','m3skill','m3resp'] };
  /* C1: which modules each group is tested on. Radiology groups skip Module 2 without a check. */
  var C1_PLAN = {
    student:     ['m1learn','m1metric','m1short','m2data','m2report','m3evid','m3skill'],
    radtrainee:  ['m1learn','m1metric','m1short','m3evid','m3skill','m3resp'],
    radiologist: ['m1learn','m1metric','m1short','m3evid','m3skill','m3resp'],
    physician:   ['m1learn','m1metric','m1short','m2data','m2report','m3evid','m3skill','m3resp'],
    other:       ['m1learn','m1metric','m1short','m2mod','m2data','m2report','m3evid','m3skill']
  };

  /* ---------- Recommendation rules ---------- */
  function setAll(r, keys, status, why){ keys.forEach(function(k){ r[k]={ s:status, why:why }; }); }
  function base(group){
    var r={};
    setAll(r, LESSONS.map(function(l){ return l.key; }), 'rec', 'Part of the core course');
    if (RAD[group]) setAll(r, ['m2-1','m2-2','m2-3','m2-4'], 'skip', 'You work with images and reports every day');
    if (group==='physician') r['m2-1']={ s:'opt', why:'You likely know the main imaging tests already' };
    return r;
  }
  function fromProfile(p){
    var r=base(p.group);
    if (p.aiUse==='daily') r['m1-1']={ s:'skip', why:'You already use AI tools most days' };
    if (p.terms==='solid'){
      setAll(r, ['m1-2','m1-3'], 'skip', 'You’re comfortable with how models are trained');
      r['m1-4']={ s:'opt', why:'A quick review if the accuracy terms are solid' };
    }
    if (!RAD[p.group] && p.group!=='student'){
      if (p.reads==='yes') setAll(r, ['m2-2','m2-4'], 'opt', 'You’re comfortable reading reports');
      if (p.reads==='yes' && p.group==='physician') r['m2-1']={ s:'skip', why:'You read imaging reports comfortably' };
    }
    applyGoals(r, p.goals||[]);
    return r;
  }
  function applyGoals(r, goals){
    var g={ basics:['m1-1','m1-2','m1-3'], judge:['m1-4','m3-2'], skills:['m1-5','m3-3'], lead:['m3-4','m3-5'] };
    var label={ basics:'understanding how AI works', judge:'judging whether a tool works', skills:'keeping your own skills', lead:'teaching and leading' };
    goals.forEach(function(k){ (g[k]||[]).forEach(function(key){ r[key]={ s:'rec', why:'Matches your goal: '+label[k] }; }); });
  }
  function fromKnowledge(group, aiUse, answers){
    var r=base(group);
    if (aiUse==='daily') r['m1-1']={ s:'opt', why:'You already use AI tools most days' };
    Object.keys(answers).forEach(function(id){
      var q=KQ[id], ok=answers[id]===q.a;
      q.lessons.forEach(function(k){
        var core=k.charAt(1)==='3';
        r[k]= ok ? { s: core ? 'opt' : 'skip', why:'You got the question on '+q.topic+' right' }
                 : { s:'rec', why:'Worth doing: you missed the question on '+q.topic };
      });
    });
    return r;
  }
  function same(a,b){ return a.slice().sort().join()===b.slice().sort().join(); }
  function chosenFrom(r){ return LESSONS.filter(function(l){ return r[l.key].s==='rec'; }).map(function(l){ return l.key; }); }

  /* ---------- Helpers ---------- */
  var stage=document.getElementById('stage');
  function h(html){ stage.innerHTML=html; window.scrollTo(0,0); }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function tag(s){ return '<span class="tag '+s+'">'+({rec:'Recommended',opt:'Optional',skip:'Can skip'})[s]+'</span>'; }
  function mins(n){ var m=n*MIN_PER_LESSON; return m<60 ? m+' min' : (Math.round(m/6)/10)+' h'; }
  function optBtn(v, label, note, pressed, multi){
    return '<button class="opt'+(multi?' multi':'')+'" data-v="'+v+'" aria-pressed="'+(pressed?'true':'false')+'"><span class="dot"></span><span><b>'+esc(label)+'</b>'+(note?'<small>'+esc(note)+'</small>':'')+'</span></button>';
  }
  function intro(title, lede, onStart){
    h('<div class="card narrow"><p class="eyebrow">Signed in &middot; before you start</p><h2>'+title+'</h2><p class="lede">'+lede+'</p>'+
      '<div class="row"><button class="btn" id="go">Start</button><button class="btn link" id="skip">Skip and see all lessons</button></div>'+
      '<p class="fine">Your answers are saved to your profile so we can suggest lessons. You can retake this from the progress panel.</p></div>');
    stage.querySelector('#go').onclick=onStart;
    stage.querySelector('#skip').onclick=function(){ result(base('student'), { kind:'skipped' }, 'checklist'); };
  }

  /* Checklist with reasons; editable. Used by several result screens. */
  function checklistHtml(r, chosen, compact){
    var out='';
    MODULES.forEach(function(m){
      var ls=LESSONS.filter(function(l){ return l.m===m.id; });
      var n=ls.filter(function(l){ return chosen.indexOf(l.key)>-1; }).length;
      out+='<div class="mod"><div class="mod-head"><b>Module '+m.n+' &middot; '+m.name+'</b><small>'+n+' of '+ls.length+'</small></div>';
      ls.forEach(function(l){
        var on=chosen.indexOf(l.key)>-1;
        out+= compact
          ? '<div class="les'+(on?'':' off')+'"><span class="t">'+l.key.replace('m','').replace('-','.')+' '+esc(l.t)+'</span>'+tag(r[l.key].s)+'</div>'
          : '<label class="les'+(on?'':' off')+'"><input type="checkbox" data-k="'+l.key+'"'+(on?' checked':'')+'><span><span class="t">'+l.key.replace('m','').replace('-','.')+' '+esc(l.t)+'</span><span class="why">'+esc(r[l.key].why)+'</span></span>'+tag(r[l.key].s)+'</label>';
      });
      out+='</div>';
    });
    return out;
  }
  function summaryHtml(chosen){
    return '<div class="summary"><div><b>'+chosen.length+'</b><small>lessons</small></div><div><b>'+mins(chosen.length)+'</b><small>about</small></div><div><b>'+(14-chosen.length)+'</b><small>left out</small></div></div>';
  }
  function bindChecklist(scope, chosen, onChange){
    scope.querySelectorAll('input[data-k]').forEach(function(cb){
      cb.onchange=function(){
        var k=cb.getAttribute('data-k'), i=chosen.indexOf(k);
        if (cb.checked && i===-1) chosen.push(k);
        if (!cb.checked && i>-1) chosen.splice(i,1);
        cb.closest('.les').classList.toggle('off', !cb.checked);
        onChange();
      };
    });
  }
  var certNote='<p class="fine">Only lessons you finish appear on your certificate. You can add any lesson later from the course outline.</p>';

  /* ---------- Result screens ---------- */
  function result(r, meta, style){
    var chosen=chosenFrom(r);
    if (style==='cards') return resultCards(r, meta, chosen);
    if (style==='route') return resultRoute(r, meta, chosen);
    resultChecklist(r, meta, chosen);
  }
  function resultChecklist(r, meta, chosen){
    var rec=chosenFrom(r);
    function draw(){
      h('<div class="card narrow"><p class="eyebrow">Your suggested path</p><h2>Here&rsquo;s where we&rsquo;d start you</h2>'+
        '<p class="lede">Recommended lessons are ticked. Untick anything you don&rsquo;t want, or tick anything you do.</p>'+
        '<div id="sum">'+summaryHtml(chosen)+'</div>'+checklistHtml(r, chosen)+
        '<div class="row"><button class="btn" id="save">Start these '+chosen.length+' lessons</button><button class="btn ghost" id="full">Take the full course instead</button></div>'+
        (!same(chosen, rec) ? '<p class="fine"><button class="btn link" id="reset" style="padding:0">Go back to the suggestion</button></p>' : '')+certNote+'</div>');
      bindChecklist(stage, chosen, draw);
      stage.querySelector('#save').onclick=function(){ saved(meta, rec, chosen, same(chosen, rec)?'recommended':'custom'); };
      stage.querySelector('#full').onclick=function(){ saved(meta, rec, LESSONS.map(function(l){return l.key;}), 'full'); };
      var rs=stage.querySelector('#reset'); if (rs) rs.onclick=function(){ chosen=rec.slice(); draw(); };
    }
    draw();
  }
  function resultCards(r, meta, chosen){
    var rec=chosen.slice(), all=LESSONS.map(function(l){ return l.key; });
    var skipped=LESSONS.filter(function(l){ return rec.indexOf(l.key)===-1; }).map(function(l){ return l.t; });
    h('<div class="card"><p class="eyebrow">Your results</p><h2>Three ways to go from here</h2>'+
      '<p class="lede">Based on your answers we&rsquo;d suggest the path on the left. The choice is yours.</p>'+
      '<div class="paths">'+
        '<button class="path main" id="pRec"><b>Suggested path</b><span class="big">'+rec.length+' lessons</span><small>About '+mins(rec.length)+'. Leaves out '+(skipped.length?esc(skipped.slice(0,3).join(', '))+(skipped.length>3?' and '+(skipped.length-3)+' more':''):'nothing')+'.</small><span class="go">Start this path &rarr;</span></button>'+
        '<button class="path" id="pFull"><b>Full course</b><span class="big">14 lessons</span><small>About '+mins(14)+'. Every lesson in order, start to finish.</small><span class="go">Take everything &rarr;</span></button>'+
        '<button class="path" id="pOwn"><b>Pick my own</b><span class="big">You choose</span><small>Start from the suggestion and add or remove lessons.</small><span class="go">Edit the list &rarr;</span></button>'+
      '</div>'+
      '<details><summary style="cursor:pointer;color:var(--blue)">See why each lesson was suggested</summary><div style="margin-top:12px">'+checklistHtml(r, rec, true)+'</div></details>'+certNote+'</div>');
    stage.querySelector('#pRec').onclick=function(){ saved(meta, rec, rec, 'recommended'); };
    stage.querySelector('#pFull').onclick=function(){ saved(meta, rec, all, 'full'); };
    stage.querySelector('#pOwn').onclick=function(){ resultChecklist(r, meta, rec.slice()); };
  }
  function resultRoute(r, meta, chosen){
    var rec=chosen.slice();
    function draw(){
      var rows=MODULES.map(function(m){
        var ls=LESSONS.filter(function(l){ return l.m===m.id; });
        return '<div class="rrow"><div class="rrow-name"><b>Module '+m.n+'</b><small>'+m.name+'</small></div><div class="stops">'+
          ls.map(function(l){
            var on=chosen.indexOf(l.key)>-1, st=r[l.key].s;
            return '<button class="stop'+(on?'':(st==='opt'?' opt':' off'))+'" data-k="'+l.key+'" title="'+esc(r[l.key].why)+'" aria-pressed="'+on+'"><i>'+l.key.replace('m','').replace('-','.')+'</i><span>'+esc(l.t)+'</span></button>';
          }).join('')+'</div></div>';
      }).join('');
      h('<div class="card"><p class="eyebrow">Your route</p><h2>Your stops are lit up</h2>'+
        '<p class="lede">Click any stop to add or remove it. Hover a stop to see why it was suggested.</p>'+
        '<div class="legend"><span><i style="background:var(--teal)"></i>On your route</span><span><i style="background:var(--amber-l);box-shadow:0 0 0 2px var(--amber)"></i>Optional, worth a look</span><span><i style="background:#fff;box-shadow:0 0 0 2px #b8c4d0"></i>Can skip</span></div>'+
        '<div class="route">'+rows+'</div>'+summaryHtml(chosen)+
        '<div class="row"><button class="btn" id="save">Start my route</button><span><button class="btn ghost" id="full">Take the full course</button> <button class="btn link" id="reset">Reset to suggestion</button></span></div>'+certNote+'</div>');
      stage.querySelectorAll('.stop').forEach(function(b){
        b.onclick=function(){ var k=b.getAttribute('data-k'), i=chosen.indexOf(k); if (i>-1) chosen.splice(i,1); else chosen.push(k); draw(); };
      });
      stage.querySelector('#save').onclick=function(){ saved(meta, rec, chosen, same(chosen, rec)?'recommended':'custom'); };
      stage.querySelector('#full').onclick=function(){ saved(meta, rec, LESSONS.map(function(l){return l.key;}), 'full'); };
      stage.querySelector('#reset').onclick=function(){ chosen=rec.slice(); draw(); };
    }
    draw();
  }
  function saved(meta, rec, chosen, choice){
    var order=LESSONS.map(function(l){ return l.key; });
    chosen=chosen.slice().sort(function(a,b){ return order.indexOf(a)-order.indexOf(b); });
    var doc={ placement:{ version:1, variant:current, group:meta.group||null, answers:meta.answers||{}, recommended:rec, chosen:chosen, choice:choice, takenAt:'2026-10-14T15:02:00Z' } };
    h('<div class="card narrow"><p class="eyebrow">Saved</p><h2>You&rsquo;re set. First up: '+esc((LESSONS.filter(function(l){ return l.key===chosen[0]; })[0]||{t:'—'}).t)+'</h2>'+
      '<p class="lede">In the real site this would open the first lesson, and the course outline would show only your '+chosen.length+' lessons. Below is what would be saved to the learner&rsquo;s Firebase profile (<code>users/{uid}</code>).</p>'+
      '<pre>'+esc(JSON.stringify(doc,null,2))+'</pre><button class="btn ghost" id="again">Try this version again</button></div>');
    stage.querySelector('#again').onclick=function(){ run(current); };
  }

  /* ---------- A1: step by step ---------- */
  function runA1(){
    var p={ goals:[] };
    var keys=['group','aiUse','terms','reads','goals'];
    function steps(){ return keys.filter(function(k){ return !(PROFILE_Q[k].skipFor && PROFILE_Q[k].skipFor[p.group]); }); }
    function show(i){
      var list=steps(), k=list[i], Q=PROFILE_Q[k], multi=!!Q.multi;
      var val=p[k];
      h('<div class="card narrow"><div class="progress"><i style="width:'+((i)/list.length*100)+'%"></i></div>'+
        '<p class="eyebrow">Question '+(i+1)+' of '+list.length+'</p><h2>'+esc(Q.q)+'</h2>'+(Q.hint?'<p class="lede">'+Q.hint+'</p>':'')+
        '<div class="opts">'+Q.opts.map(function(o){ return optBtn(o.v,o.label,o.note, multi ? val.indexOf(o.v)>-1 : val===o.v, multi); }).join('')+'</div>'+
        '<div class="row"><button class="btn link" id="back"'+(i?'':' style="visibility:hidden"')+'>Back</button><button class="btn" id="next"'+((multi?val.length:val)?'':' disabled')+'>'+(i===list.length-1?'See my path':'Next')+'</button></div></div>');
      stage.querySelectorAll('.opt').forEach(function(b){
        b.onclick=function(){
          var v=b.getAttribute('data-v');
          if (multi){ var j=p[k].indexOf(v); if (j>-1) p[k].splice(j,1); else p[k].push(v); }
          else p[k]=v;
          show(i);
        };
      });
      stage.querySelector('#back').onclick=function(){ show(i-1); };
      stage.querySelector('#next').onclick=function(){ if (i===list.length-1) result(fromProfile(p), { group:p.group, answers:p }, 'checklist'); else show(i+1); };
    }
    intro('Five quick questions to find your starting point', 'About a minute. We&rsquo;ll suggest which lessons to take, and you can change anything before you start.', function(){ show(0); });
  }

  /* ---------- A2: one page, live preview ---------- */
  function runA2(){
    var p={ goals:[] };
    function draw(){
      var ready=p.group && p.aiUse && p.terms && (RAD[p.group] || p.reads);
      var r=ready ? fromProfile(p) : null, chosen=r ? chosenFrom(r) : [];
      var qs=['group','aiUse','terms','reads','goals'].filter(function(k){ return !(PROFILE_Q[k].skipFor && PROFILE_Q[k].skipFor[p.group]); });
      var form=qs.map(function(k){
        var Q=PROFILE_Q[k];
        return '<div><p class="q-label">'+esc(Q.q)+(Q.hint?' <small style="font-weight:400;color:var(--muted)">'+Q.hint+'</small>':'')+'</p><div class="chips">'+
          Q.opts.map(function(o){ var on=Q.multi ? p[k].indexOf(o.v)>-1 : p[k]===o.v; return '<button class="chip" data-k="'+k+'" data-v="'+o.v+'" aria-pressed="'+on+'">'+esc(o.label)+'</button>'; }).join('')+'</div></div>';
      }).join('');
      var side= ready
        ? '<p class="eyebrow">Your path so far</p>'+summaryHtml(chosen)+'<div class="mini">'+checklistHtml(r, chosen, true)+'</div>'+
          '<div class="row"><button class="btn" id="save">Start these lessons</button><button class="btn link" id="edit">Change the list</button></div>'
        : '<p class="eyebrow">Your path</p><h3>Answer the questions on the left</h3><p class="lede" style="margin:0">Your suggested lessons will appear here and update as you go.</p>';
      h('<div class="split"><div class="card"><p class="eyebrow">Signed in &middot; before you start</p><h2>Tell us a little about you</h2><p class="lede">We&rsquo;ll suggest lessons as you answer. Nothing is locked in.</p>'+form+
        '<button class="btn link" id="skip" style="padding:0">Skip and see all lessons</button></div>'+
        '<div class="card sticky">'+side+(ready?certNote:'')+'</div></div>');
      stage.querySelectorAll('.chip').forEach(function(c){
        c.onclick=function(){
          var k=c.getAttribute('data-k'), v=c.getAttribute('data-v');
          if (PROFILE_Q[k].multi){ var j=p[k].indexOf(v); if (j>-1) p[k].splice(j,1); else p[k].push(v); } else p[k]=v;
          draw();
        };
      });
      stage.querySelector('#skip').onclick=function(){ result(base('student'), { kind:'skipped' }, 'checklist'); };
      if (ready){
        stage.querySelector('#save').onclick=function(){ saved({ group:p.group, answers:p }, chosen, chosen, 'recommended'); };
        stage.querySelector('#edit').onclick=function(){ resultChecklist(r, { group:p.group, answers:p }, chosen.slice()); };
      }
    }
    draw();
  }

  /* ---------- Knowledge question screen (C1, C2) ---------- */
  function askKQ(ids, i, answers, label, done){
    var q=KQ[ids[i]], picked=answers[ids[i]];
    var answered=picked!==undefined;
    h('<div class="card narrow"><div class="progress"><i style="width:'+((i+(answered?1:0))/ids.length*100)+'%"></i></div>'+
      '<p class="eyebrow">'+label+' &middot; '+(i+1)+' of '+ids.length+'</p><h2 style="font-size:1.2rem">'+esc(q.q)+'</h2>'+
      '<div class="opts">'+q.opts.map(function(o,j){
        var cls= answered ? (j===q.a?' correct':(j===picked?' wrong':'')) : '';
        return '<button class="opt'+cls+'" data-j="'+j+'" aria-pressed="'+(j===picked)+'"'+(answered?' disabled':'')+'><span class="dot"></span><span><b>'+esc(o)+'</b></span></button>';
      }).join('')+'</div>'+
      (answered?'<div class="explain"><strong>'+(picked===q.a?'Right.':'Not quite.')+'</strong> '+esc(q.why)+'</div>':'')+
      '<div class="row"><button class="btn link" id="dk"'+(answered?' style="visibility:hidden"':'')+'>I don&rsquo;t know</button><button class="btn" id="next"'+(answered?'':' disabled')+'>'+(i===ids.length-1?'Done':'Next')+'</button></div></div>');
    stage.querySelectorAll('.opt').forEach(function(b){ b.onclick=function(){ answers[ids[i]]=+b.getAttribute('data-j'); askKQ(ids,i,answers,label,done); }; });
    stage.querySelector('#dk').onclick=function(){ answers[ids[i]]=-1; askKQ(ids,i,answers,label,done); };
    stage.querySelector('#next').onclick=function(){ if (i===ids.length-1) done(); else askKQ(ids,i+1,answers,label,done); };
  }
  function askProfile2(p, then){
    function draw(){
      h('<div class="card narrow"><p class="eyebrow">Step 1 of 2 &middot; About you</p><h2>Two quick questions</h2>'+
        '<p class="q-label">'+PROFILE_Q.group.q+'</p><div class="opts">'+PROFILE_Q.group.opts.map(function(o){ return optBtn(o.v,o.label,o.note,p.group===o.v); }).join('')+'</div>'+
        '<p class="q-label">'+PROFILE_Q.aiUse.q+'</p><div class="chips">'+PROFILE_Q.aiUse.opts.map(function(o){ return '<button class="chip" data-v="'+o.v+'" aria-pressed="'+(p.aiUse===o.v)+'">'+o.label+'</button>'; }).join('')+'</div>'+
        '<div class="row"><span></span><button class="btn" id="next"'+(p.group&&p.aiUse?'':' disabled')+'>Next</button></div></div>');
      stage.querySelectorAll('.opt').forEach(function(b){ b.onclick=function(){ p.group=b.getAttribute('data-v'); draw(); }; });
      stage.querySelectorAll('.chip').forEach(function(b){ b.onclick=function(){ p.aiUse=b.getAttribute('data-v'); draw(); }; });
      stage.querySelector('#next').onclick=then;
    }
    draw();
  }

  /* ---------- C1: profile + short check ---------- */
  function runC1(){
    var p={}, answers={};
    intro('A short check to find your starting point', 'Two questions about you, then 6 to 8 short questions on the course topics. About 4 minutes. Get one right and we&rsquo;ll suggest skipping that lesson. No score is shown.', function(){
      askProfile2(p, function(){
        var ids=C1_PLAN[p.group];
        h('<div class="card narrow"><p class="eyebrow">Step 2 of 2 &middot; Quick check</p><h2>'+ids.length+' short questions</h2>'+
          '<p class="lede">'+(RAD[p.group]?'Since you work in radiology, we&rsquo;ve left out the Radiology Basics questions and marked that module as skippable. ':'')+
          'If you&rsquo;re not sure, choose &ldquo;I don&rsquo;t know&rdquo; rather than guessing. It gives a better suggestion.</p><button class="btn" id="go">Begin</button></div>');
        stage.querySelector('#go').onclick=function(){
          askKQ(ids, 0, answers, 'Quick check', function(){ result(fromKnowledge(p.group, p.aiUse, answers), { group:p.group, answers:{ profile:p, check:answers } }, 'cards'); });
        };
      });
    });
  }

  /* ---------- C2: test out module by module ---------- */
  function runC2(){
    var p={}, answers={}, mods=[], idx=0;
    function next(){
      if (idx>=mods.length){
        var r=fromKnowledge(p.group, p.aiUse, answers);
        mods.forEach(function(m){ if (m.choice==='take') LESSONS.forEach(function(l){ if (l.m===m.id) r[l.key]={ s:'rec', why:'You chose to take this module' }; }); });
        mods.forEach(function(m){ if (m.choice==='skipmod') LESSONS.forEach(function(l){ if (l.m===m.id) r[l.key]={ s:'skip', why:'You chose to skip this module' }; }); });
        return result(r, { group:p.group, answers:{ profile:p, check:answers, modules:mods } }, 'route');
      }
      var m=mods[idx], ids=KQ_BY_MODULE[m.id];
      var rad=RAD[p.group] && m.id==='m2';
      h('<div class="card narrow"><p class="eyebrow">Module '+m.n+' of 3</p><h2>'+m.name+'</h2>'+
        '<p class="lede">'+(rad ? 'You work in radiology, so you probably know this module already. You can still check yourself.' : 'Know this already? Answer '+ids.length+' questions and skip the lessons you get right.')+'</p>'+
        '<div class="opts">'+
          optBtn('test','Check what I know', ids.length+' questions, about a minute', false)+
          optBtn('take','I&rsquo;ll take this module', 'All '+LESSONS.filter(function(l){ return l.m===m.id; }).length+' lessons go on my route', false)+
          (m.id!=='m3' ? optBtn('skipmod','Skip this module', rad ? 'Suggested for you' : 'You can add it back later', false) : '')+
        '</div></div>');
      stage.querySelectorAll('.opt').forEach(function(b){
        b.onclick=function(){
          m.choice=b.getAttribute('data-v');
          if (m.choice==='test') askKQ(ids, 0, answers, m.name, function(){ idx++; next(); });
          else { idx++; next(); }
        };
      });
    }
    intro('Test out of what you already know', 'Two questions about you, then each module offers a short optional check. Skip the checks you don&rsquo;t need. 1 to 5 minutes.', function(){
      askProfile2(p, function(){ mods=MODULES.map(function(m){ return { id:m.id, n:m.n, name:m.name, choice:null }; }); idx=0; next(); });
    });
  }

  /* ---------- Tabs ---------- */
  var NOTES = {
    A1:'<strong>A1.</strong> Five questions, one per screen (radiology groups see four). About a minute. Result: a checklist that gives a reason for each lesson.',
    A2:'<strong>A2.</strong> The same questions on one page. The suggested lessons update on the right as you answer. Fastest for people who want to skim.',
    C1:'<strong>C1.</strong> Two profile questions, then 6&ndash;8 knowledge questions picked by group (radiology groups skip the Module 2 questions). Result: three side-by-side path cards.',
    C2:'<strong>C2.</strong> Two profile questions, then each module asks: check what I know, take it, or skip it. Result: the route map with lessons lit up; click to toggle.'
  };
  var current='A1';
  function run(v){
    current=v;
    document.querySelectorAll('.mk-tab').forEach(function(t){ t.setAttribute('aria-selected', t.getAttribute('data-v')===v); });
    document.getElementById('mkNote').innerHTML=NOTES[v];
    ({ A1:runA1, A2:runA2, C1:runC1, C2:runC2 })[v]();
  }
  document.querySelectorAll('.mk-tab').forEach(function(t){ t.onclick=function(){ run(t.getAttribute('data-v')); }; });
  run('A1');
})();
</script>
</body>
</html>
