<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>AI2Practice progress</title>
  <script>
  (function(){
    var q = new URLSearchParams(window.location.search);
    var target = 'index.html?progress=1';
    var p = q.get('pathway');
    if (p === 'beginner' || p === 'intermediate' || p === 'advanced') target += '&pathway=' + encodeURIComponent(p);
    window.location.replace(target + '#progress');
  })();
  </script>
</head>
<body>
  <p>Progress now opens directly within AI2Practice. <a href="index.html?progress=1#progress">Open progress</a>.</p>
</body>
</html>
